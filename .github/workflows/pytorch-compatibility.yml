name: PyTorch compatibility

on:
  push:
  pull_request:

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU compatibility dependencies
        run: python -m pip install torch numpy pytest pyyaml
      - name: Run compatibility tests
        run: python -m pytest -q pytorch/tests
      - name: Run synthetic end-to-end smoke test
        run: python -m pytorch.train
